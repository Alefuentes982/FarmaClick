<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaClick — Modelo de Datos Interactivo (v3)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-svg@0.4.0/cytoscape-svg.js"></script>
<style>
  :root {
    --bg: #f5f4f1;
    --bg2: #ffffff;
    --bg3: #ece8e0;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #2a2620;
    --text2: #5c564a;
    --text3: #8a8375;
    --accent: #2a2620;
    --accent-on: #f5f4f1;
    --sans: 'Segoe UI', system-ui, sans-serif;
    --mono: 'Consolas', 'SFMono-Regular', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header {
    flex-shrink: 0; background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .header-title { font-size: 15px; font-weight: 700; color: var(--text); font-family: Georgia, serif; }
  .header-title span { color: #c1552a; }
  .header-sub { font-size: 11px; color: var(--text3); }

  .tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: 10px; padding: 3px; }
  .tab {
    padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
    color: var(--text2); cursor: pointer; border: none; background: transparent; transition: all .15s;
  }
  .tab.active { background: var(--accent); color: var(--accent-on); }
  .tab:not(.active):hover { color: var(--text); }

  .toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text2); font-size: 12px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: #e0dbd0; color: var(--text); border-color: rgba(0,0,0,0.22); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 600; }
  .btn.primary:hover { background: #4a453c; }
  select, input[type=text].tsearch {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text); font-size: 12px;
  }
  input[type=text].tsearch { width: 150px; }
  select { cursor: pointer; }

  .legend {
    flex-shrink: 0; background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 7px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  #cy { flex: 1; background: var(--bg); cursor: grab; }
  #cy:active { cursor: grabbing; }

  #panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 380px;
    background: var(--bg2); border-left: 1px solid var(--border2);
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform .25s cubic-bezier(.4,0,.2,1); z-index: 200;
    box-shadow: -8px 0 40px rgba(0,0,0,0.14);
  }
  #panel.open { transform: translateX(0); }

  .panel-header { padding: 16px 18px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
  .panel-header-info { flex: 1; min-width: 0; }
  .panel-table-name { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .panel-mod-tag { display: inline-block; font-size: 10px; font-weight: 600; border-radius: 20px; padding: 2px 9px; margin-bottom: 6px; }
  .panel-table-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .panel-close { background: none; border: 1px solid var(--border2); color: var(--text3); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .panel-close:hover { color: var(--text); border-color: rgba(0,0,0,0.3); }

  .panel-search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .panel-search input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; outline: none; }
  .panel-search input::placeholder { color: var(--text3); }

  .panel-body { flex: 1; overflow-y: auto; padding: 0; }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: #d6d0c2; border-radius: 4px; }

  .field-row { display: grid; grid-template-columns: 1fr auto; gap: 0; border-bottom: 1px solid rgba(0,0,0,0.06); padding: 10px 18px; transition: background .1s; }
  .field-row:hover { background: rgba(0,0,0,0.03); }
  .field-row.is-pk { background: rgba(184,132,42,0.08); }
  .field-row.is-fk { background: rgba(61,108,148,0.08); }
  .field-left { min-width: 0; }
  .field-name { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 2px; }
  .field-desc { font-size: 11px; color: var(--text2); line-height: 1.45; }
  .field-right { text-align: right; padding-left: 10px; flex-shrink: 0; }
  .field-type { font-family: var(--mono); font-size: 10px; color: var(--text3); white-space: nowrap; }

  .badge { display: inline-block; font-size: 9px; font-weight: 700; border-radius: 3px; padding: 1px 5px; line-height: 1.4; }
  .badge-pk { background: rgba(184,132,42,0.2); color: #8f6620; }
  .badge-fk { background: rgba(61,108,148,0.16); color: #2c5578; }
  .badge-uq { background: rgba(47,133,121,0.16); color: #236459; }
  .field-null { color: var(--text3); font-style: italic; }

  .panel-relations { padding: 12px 18px; border-top: 1px solid var(--border); }
  .panel-rel-title { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .rel-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 8px; font-size: 11px; margin: 3px 3px 0 0; cursor: pointer; transition: all .15s; font-family: var(--mono); }
  .rel-chip:hover { background: #e0dbd0; border-color: var(--accent); color: var(--text); }
  .rel-chip .arrow { color: var(--text3); font-size: 10px; }

  .statusbar { flex-shrink: 0; background: var(--bg2); border-top: 1px solid var(--border); padding: 5px 20px; display: flex; align-items: center; gap: 16px; font-size: 11px; color: var(--text3); }
  .statusbar span b { color: var(--text2); }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Farma<span>Click</span> — Modelo de Datos</div>
    <div class="header-sub" id="headerSub">PostgreSQL · Supabase</div>
  </div>
  <div class="tabs">
    <button class="tab" data-view="conceptual" onclick="switchView('conceptual')">Conceptual</button>
    <button class="tab" data-view="logico" onclick="switchView('logico')">Lógico</button>
    <button class="tab active" data-view="fisico" onclick="switchView('fisico')">Físico</button>
  </div>
  <div class="toolbar">
    <input type="text" class="tsearch" id="tableSearch" placeholder="Buscar tabla…" oninput="searchTable(this.value)">
    <select id="modFilter" onchange="filterModule(this.value)">
      <option value="all">Todos los módulos</option>
    </select>
    <select id="layoutSel" onchange="changeLayout(this.value)">
      <option value="cose">Orgánico</option>
      <option value="breadthfirst">Árbol</option>
      <option value="circle">Circular</option>
      <option value="concentric">Concéntrico</option>
    </select>
    <button class="btn" onclick="cy.fit(undefined,60)">Ajustar</button>
    <button class="btn" onclick="zoomIn()">＋</button>
    <button class="btn" onclick="zoomOut()">－</button>
    <button class="btn primary" onclick="downloadSVG()">Descargar SVG</button>
    <button class="btn" onclick="downloadPNG()">Descargar PNG</button>
  </div>
</div>

<div class="legend" id="legendRow"></div>

<div id="cy"></div>

<div id="panel">
  <div class="panel-header">
    <div class="panel-header-info">
      <div class="panel-table-name" id="pTableName"></div>
      <div id="pModTag"></div>
      <div class="panel-table-desc" id="pTableDesc"></div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-search" id="pSearchWrap">
    <input type="text" id="fieldSearch" placeholder="Buscar campo…" oninput="filterFields(this.value)">
  </div>
  <div class="panel-body" id="pFields"></div>
  <div class="panel-relations" id="pRelations"></div>
</div>

<div class="statusbar">
  <span>Vista: <b id="stView">Físico</b></span>
  <span>Tablas: <b id="stNodes"></b></span>
  <span>Relaciones: <b id="stEdges"></b></span>
  <span id="stSelected"></span>
</div>

<script>
const MOD_COLORS = {
  Accesos:       { bg:'#e8f0f6', border:'#3d6c94', text:'#2c5578', tag:'#dce9f2', label:'Accesos y Organización' },
  Catalogo:      { bg:'#eef3e7', border:'#5c7f42', text:'#46612f', tag:'#e3ebd9', label:'Catálogo y Stock' },
  Compras:       { bg:'#faf1dd', border:'#b8842a', text:'#8f6620', tag:'#f5e7c6', label:'Compras' },
  Ventas:        { bg:'#fbebe2', border:'#c1552a', text:'#9c4420', tag:'#f7ddd0', label:'Ventas' },
  Devoluciones:  { bg:'#f1e9f5', border:'#7b52ab', text:'#5f3d87', tag:'#e7dcef', label:'Devoluciones' },
  Caja:          { bg:'#e4f2f0', border:'#2f8579', text:'#236459', tag:'#d4e9e5', label:'Caja y Turnos' },
};
const SUB_LABEL = { conceptual: '36 entidades · sin atributos', logico: '39 tablas · tipos genéricos', fisico: '39 tablas · tipos reales PostgreSQL · migraciones 001–010' };
const VIEW_TITLE = { conceptual: 'Conceptual', logico: 'Lógico', fisico: 'Físico' };

let currentView = 'fisico';
let cy = null;

function buildElements(view) {
  const vdata = DATA[view];
  const els = [];
  Object.entries(vdata.nodes).forEach(([id, info]) => {
    const c = MOD_COLORS[info.mod];
    els.push({ data: { id, label: id, mod: info.mod, desc: info.desc, fields: info.fields || null,
      bgColor: c.bg, borderColor: c.border, textColor: c.text } });
  });
  let i = 0;
  vdata.edges.forEach(e => {
    if (view === 'conceptual' && !e.in_concept) return;
    if (!vdata.nodes[e.from] || !vdata.nodes[e.to]) return;
    const label = view === 'conceptual' ? e.concept_label : e.tech_label;
    els.push({ data: { id:'e'+(i++), source:e.from, target:e.to, label } });
  });
  if (view === 'conceptual' && vdata.extra_edges) {
    vdata.extra_edges.forEach(e => {
      els.push({ data: { id:'e'+(i++), source:e.from, target:e.to, label:e.concept_label } });
    });
  }
  return els;
}

function initCy(view) {
  const container = document.getElementById('cy');
  if (cy) cy.destroy();
  cy = cytoscape({
    container,
    elements: buildElements(view),
    style: [
      { selector:'node', style:{
          shape:'round-rectangle', width:'label', height:36, padding:'10px',
          'background-color':'data(bgColor)', 'border-color':'data(borderColor)',
          'border-width':1.5, label:'data(label)', color:'data(textColor)',
          'font-size':11, 'font-family':'Consolas, monospace', 'font-weight':600,
          'text-valign':'center', 'text-halign':'center', cursor:'pointer',
      }},
      { selector:'node:selected', style:{ 'border-width':3, 'border-color':'#fff', 'background-color':'data(borderColor)', color:'#ffffff' }},
      { selector:'node.highlighted', style:{ 'border-width':2.5, 'background-color':'data(borderColor)', color:'#ffffff', opacity:1 }},
      { selector:'node.faded', style:{ opacity:0.15 }},
      { selector:'edge', style:{
          width:1.4, 'line-color':'#a8a293', 'target-arrow-color':'#a8a293',
          'target-arrow-shape':'triangle', 'arrow-scale':1, 'curve-style':'bezier',
          label:'data(label)', 'font-size':9, 'font-family':'Consolas, monospace',
          color:'#6b6559', 'text-background-color':'#f5f4f1', 'text-background-opacity':1,
          'text-background-padding':'2px', 'edge-text-rotation':'autorotate',
      }},
      { selector:'edge.highlighted', style:{ 'line-color':'#2a2620', 'target-arrow-color':'#2a2620', color:'#2a2620', width:2, opacity:1 }},
      { selector:'edge.faded', style:{ opacity:0.05 }},
    ],
    layout:{ name:'cose', animate:true, animationDuration:800, nodeRepulsion:()=>220000, edgeElasticity:()=>100, idealEdgeLength:()=>130, gravity:0.35, numIter:2000, padding:70 },
    userZoomingEnabled:true, userPanningEnabled:true, boxSelectionEnabled:false, minZoom:0.1, maxZoom:3, wheelSensitivity:0.3,
  });
  cy.on('tap', 'node', e => openPanel(e.target));
  cy.on('tap', e => { if (e.target === cy) closePanel(); });
  document.getElementById('stNodes').textContent = cy.nodes().length;
  document.getElementById('stEdges').textContent = cy.edges().length;
}

function renderLegend(view) {
  const mods = [...new Set(Object.values(DATA[view].nodes).map(n => n.mod))];
  const html = mods.map(m => `<div class="legend-item"><div class="legend-dot" style="background:${MOD_COLORS[m].border}"></div> ${MOD_COLORS[m].label}</div>`).join('');
  document.getElementById('legendRow').innerHTML = html +
    `<div class="legend-item" style="margin-left:auto">
       <svg width="24" height="10" viewBox="0 0 24 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#a8a293" stroke-width="1.5" stroke-dasharray="4 2"/><polygon points="18,2 24,5 18,8" fill="#a8a293"/></svg>
       Relación
     </div>
     <div class="legend-item">Click en tabla → ver detalle · Arrastrar → mover · Scroll → zoom · PK clave primaria · FK clave foránea · UQ único · null opcional</div>`;
}

function switchView(view) {
  currentView = view;
  closePanel();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('headerSub').textContent = SUB_LABEL[view];
  document.getElementById('stView').textContent = VIEW_TITLE[view];
  document.getElementById('modFilter').value = 'all';
  document.getElementById('tableSearch').value = '';
  renderLegend(view);
  initCy(view);
}

let currentNode = null;
let allFieldRows = [];

function openPanel(node) {
  currentNode = node;
  const data = node.data();
  const c = MOD_COLORS[data.mod];

  document.getElementById('pTableName').textContent = data.id;
  document.getElementById('pTableDesc').textContent = data.desc || '';
  document.getElementById('pModTag').innerHTML =
    `<span class="panel-mod-tag" style="background:${c.tag};color:${c.text};border:1px solid ${c.border}">${c.label}</span>`;

  const container = document.getElementById('pFields');
  container.innerHTML = '';
  allFieldRows = [];
  const searchWrap = document.getElementById('pSearchWrap');

  if (data.fields) {
    searchWrap.style.display = '';
    data.fields.forEach(f => {
      const [name, type, note, desc] = f;
      const isPK = note.includes('PK');
      const isFK = note.includes('FK');
      const isUQ = note.includes('UQ');
      const isNull = /(^|,)N(,|$)/.test(note);
      const row = document.createElement('div');
      row.className = 'field-row' + (isPK ? ' is-pk' : isFK ? ' is-fk' : '');
      row.dataset.search = (name + ' ' + desc + ' ' + type).toLowerCase();
      const badges = (isPK ? '<span class="badge badge-pk">PK</span>' : '') + (isFK ? '<span class="badge badge-fk">FK</span>' : '') + (isUQ ? '<span class="badge badge-uq">UQ</span>' : '');
      row.innerHTML = `
        <div class="field-left">
          <div class="field-name">${name} ${badges}</div>
          <div class="field-desc">${desc || ''}</div>
        </div>
        <div class="field-right"><div class="field-type">${type}${isNull ? ' <span class="field-null">· null</span>' : ''}</div></div>`;
      container.appendChild(row);
      allFieldRows.push(row);
    });
  } else {
    searchWrap.style.display = 'none';
  }

  const relDiv = document.getElementById('pRelations');
  const edges = node.connectedEdges();
  if (edges.length === 0) { relDiv.innerHTML = ''; }
  else {
    let chips = '';
    edges.forEach(e => {
      const other = e.source().id() === data.id ? e.target() : e.source();
      const dir = e.source().id() === data.id ? '→' : '←';
      const c2 = MOD_COLORS[other.data('mod')];
      chips += `<span class="rel-chip" onclick="jumpToNode('${other.id()}')" style="color:${c2.text}"><span class="arrow">${dir}</span>${other.id()}</span>`;
    });
    relDiv.innerHTML = `<div class="panel-rel-title">Tablas relacionadas (${edges.length})</div>${chips}`;
  }

  document.getElementById('fieldSearch').value = '';
  document.getElementById('panel').classList.add('open');

  cy.elements().removeClass('highlighted faded');
  const hood = node.closedNeighborhood();
  hood.addClass('highlighted');
  cy.elements().not(hood).addClass('faded');
  document.getElementById('stSelected').textContent = `Seleccionado: ${data.id}` + (data.fields ? ` · ${data.fields.length} campos` : '');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  if (cy) cy.elements().removeClass('highlighted faded');
  document.getElementById('stSelected').textContent = '';
  currentNode = null;
}

function filterFields(q) {
  const lq = q.toLowerCase();
  allFieldRows.forEach(row => { row.style.display = (!lq || row.dataset.search.includes(lq)) ? '' : 'none'; });
}

function jumpToNode(id) {
  const node = cy.getElementById(id);
  cy.animate({ center:{ eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 400 });
  openPanel(node);
}

function zoomIn() { cy.zoom({ level: cy.zoom()*1.25, renderedPosition:{ x:cy.width()/2, y:cy.height()/2 }}); }
function zoomOut() { cy.zoom({ level: cy.zoom()*0.8, renderedPosition:{ x:cy.width()/2, y:cy.height()/2 }}); }

function filterModule(mod) {
  closePanel();
  if (mod === 'all') { cy.elements().style('opacity',1); cy.fit(undefined,60); return; }
  const show = cy.nodes().filter(n => n.data('mod') === mod);
  const showEdges = show.connectedEdges().filter(e => show.has(e.source()) && show.has(e.target()));
  cy.elements().style('opacity', 0.07);
  show.style('opacity', 1);
  showEdges.style('opacity', 1);
  cy.fit(show, 80);
}

function searchTable(q) {
  const lq = q.toLowerCase().trim();
  if (!lq) { cy.elements().style('opacity', 1); return; }
  const matches = cy.nodes().filter(n => n.id().toLowerCase().includes(lq));
  cy.elements().style('opacity', 0.08);
  matches.style('opacity', 1);
  matches.connectedEdges().style('opacity', 0.5);
  if (matches.length) cy.fit(matches, 100);
}

function changeLayout(name) {
  const opts = {
    cose: { name:'cose', animate:true, animationDuration:700, nodeRepulsion:()=>220000, edgeElasticity:()=>100, idealEdgeLength:()=>130, gravity:0.35, numIter:1500, padding:70 },
    breadthfirst: { name:'breadthfirst', animate:true, animationDuration:700, directed:true, padding:70, spacingFactor:1.5 },
    circle: { name:'circle', animate:true, animationDuration:700, padding:70 },
    concentric: { name:'concentric', animate:true, animationDuration:700, padding:70, concentric:n=>n.degree(), levelWidth:()=>2 },
  };
  cy.layout(opts[name] || opts.cose).run();
}

function downloadSVG() {
  const s = cy.svg({ scale:2, full:true, bg:'#f5f4f1' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  a.download = `farmaclick_modelo_${currentView}.svg`; a.click();
}
function downloadPNG() {
  const a = document.createElement('a');
  a.href = cy.png({ scale:2, full:true, bg:'#f5f4f1' });
  a.download = `farmaclick_modelo_${currentView}.png`; a.click();
}

Object.entries(MOD_COLORS).forEach(([k, v]) => { const o = document.createElement('option'); o.value = k; o.textContent = v.label; document.getElementById('modFilter').appendChild(o); });
switchView('fisico');
</script>
</body>
