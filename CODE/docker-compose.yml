# Entorno de desarrollo local para los tres desarrolladores: base de datos, API y frontend en contenedores.
#   docker compose up            (la primera vez tarda: crea la base e instala dependencias)
#   Frontend  http://localhost:5173      API  http://localhost:3000/api/health      Base  localhost:54329
#   Usuarios de prueba:  admin@farmaclick.local / Admin12345   y   vendedor@farmaclick.local / Vendedor12345
# Reiniciar la base desde cero (borra los datos locales):  docker compose down -v
# Los cambios en backend/ y frontend/ se recargan solos; si la API no se reinicia (Windows): docker compose restart api
name: farmaclick

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmaclick
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan solo la primera vez, en orden alfabético: esquema + migraciones, datos de desarrollo, catálogo de prueba.
      - ./db/instalacion_completa.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./db/desarrollo.sql:/docker-entrypoint-initdb.d/02-desarrollo.sql:ro
      - ./db/datos-prueba/datos-prueba.sql:/docker-entrypoint-initdb.d/03-datos-prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmaclick"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && node --watch src/server.js"
    environment:
      DATABASE_URL: postgresql://app_backend:app_backend@db:5432/farmaclick
      DATABASE_SSL: "false"
      AUTH_MODE: local            # login de desarrollo en lugar de Supabase Auth (no arranca con NODE_ENV=production)
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
    ports: ["3000:3000"]
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:3000
      VITE_POLLING: "true"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
