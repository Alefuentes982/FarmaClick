# Evita que Supabase (plan gratuito) pause el proyecto por inactividad y que Oracle considere la VM ociosa.
# Consulta /api/health/db de cada entorno cada 3 días. Variables del repositorio (Settings > Variables): URL_DEV, URL_PROD.
name: Mantener activo
on:
  schedule: [{ cron: "17 9 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "${{ vars.URL_DEV }}" "${{ vars.URL_PROD }}"; do
            [ -n "$u" ] && curl -fsS --retry 3 "$u/api/health/db" && echo
          done
          true
