# Nginx dentro del contenedor web. El balanceador de Oracle termina el HTTPS y reenvía por HTTP al puerto 80.
# El servicio "api" es el nombre del contenedor de la API en docker-compose.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Comprobación de vida para el balanceador y para Docker.
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # La API. Los PDF, CSV y Excel viajan como JSON con base64, así que no hay descargas pesadas.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: caché larga. El index.html nunca se guarda en caché.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-store"; }

  # Rutas de la SPA (React Router): cualquier otra ruta entrega index.html.
  location / { try_files $uri /index.html; }
}
